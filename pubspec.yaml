name: senior_care
description: "Praca inżynierska: aplikacja Flutter do monitorowania przyjmowania leków z powiadomieniami dla opiekuna."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.5
  firebase_core: ^4.1.1
  firebase_auth: ^6.1.0
  smooth_page_indicator: ^1.2.1
  shared_preferences: ^2.5.3
  google_sign_in: ^6.2.1
  cloud_firestore: ^6.0.3
  firebase_messaging: ^16.0.4
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
